name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Nothing here needs to write to the repository; artifact uploads use the job's
# runtime token, not this one.
permissions:
  contents: read

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single-OS on purpose: the app is AppKit plus IOKit against a macOS 13 floor,
  # so there is no second platform to matrix over.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      # First, because it is the fastest signal and the most specific failure.
      - name: Test
        run: make test

      # The build the Makefile does is warning-tolerant. This one is not: a warning
      # that nobody is forced to look at is a warning that stays.
      - name: Build with warnings as errors
        run: |
          swiftc -O Sources/cuelight/Core/*.swift Sources/cuelight/App/*.swift \
            -warnings-as-errors -o "$RUNNER_TEMP/cuelight-strict"

      # Not on the runner image, so it has to be installed. Unpinned, which means a
      # SwiftLint release can turn a branch red without that branch changing -- the
      # price of not hand-maintaining a version here.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      # The completion is shipped and installed, but never compiled by anything else,
      # so a syntax error in it would otherwise reach users.
      - name: Parse the zsh completion
        run: zsh -n completions/_cuelight

      # Exercises the whole packaging path: it draws the icon from Tools/make-icon.swift
      # (the .icns is generated, not committed), builds the bundle, ad-hoc signs it and
      # zips it. Plenty to break that a plain `swiftc` never touches.
      - name: Package
        run: make release

      - name: Checksum
        run: shasum -a 256 build/*.zip

      # Lets a pull request be downloaded and actually run, rather than trusted.
      - uses: actions/upload-artifact@v7
        with:
          name: cuelight-${{ github.sha }}
          path: build/*.zip
          retention-days: 14
