name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and package
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "build/cuelight-${version}.zip" --clobber

      - name: Bump the cask in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 "build/cuelight-${version}.zip" | cut -d' ' -f1)"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/odiumuniverse/homebrew-tap.git" tap
          cd tap
          ruby - "$version" "$sha" <<'RB'
          path = "Casks/cuelight.rb"
          src = File.read(path)
          src = src.sub(/version ".*"/, "version \"#{ARGV[0]}\"")
          src = src.sub(/sha256 ".*"/, "sha256 \"#{ARGV[1]}\"")
          File.write(path, src)
          RB
          git add Casks/cuelight.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cuelight ${version}"
          git push
